[build]
  publish = "dist"
  command = "npx tsc --noEmit --skipLibCheck && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command   = "vite"
  targetPort = 5173
  port       = 8888
  autoLaunch = false

# Bridge OAuth para o APK — serve HTML estático ANTES do catch-all SPA
[[redirects]]
  from = "/auth/native-callback"
  to = "/auth/native-callback.html"
  status = 200
  force = true

# Não existe regra para /.netlify/functions/*: o Netlify recusa esse caminho em
# redirects ("path field must not start with /.netlify") e já trata as functions
# antes do catch-all abaixo. A regra que existia aqui só gerava aviso no build.

# SPA catch-all: tudo que não seja function vai para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Segurança: aplicado a todas as respostas ────────────────────────────────
# Sem estes headers o site é enquadrável em iframe (clickjacking), vaza URLs
# internas no Referer e tira nota baixa em securityheaders.com / Observatory —
# justamente os relatórios que a landing linka na seção "Verifique você mesmo".
[[headers]]
  for = "/*"
  [headers.values]
    # 2 anos + subdomínios + elegível à preload list dos navegadores.
    # (A Netlify já enviava 1 ano sem includeSubDomains; isto substitui.)
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options     = "nosniff"
    X-Frame-Options            = "DENY"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), interest-cohort=()"
    # allow-popups (e não same-origin puro) porque o login com Google abre popup
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

    # Endpoint nomeado para a Reporting API (usado pelo `report-to` da CSP).
    Reporting-Endpoints        = "csp-endpoint=\"/.netlify/functions/csp-report\""

    # ─────────────────────────────────────────────────────────────────────────
    # CSP em modo BLOQUEANTE (promovida de Report-Only em 29/07/2026).
    #
    # A promoção foi feita por auditoria estática do que é publicado, não por
    # navegação: o index.html não tem script inline nem handler `on*=`, o único
    # `new Function(` do bundle é o polyfill do setimmediate (só dispara se
    # receber string, o que não acontece) e todo host que o bundle referencia
    # está declarado abaixo.
    #
    # A rede de segurança é o `report-uri`/`report-to`: qualquer coisa barrada
    # aparece em `netlify logs:function csp-report`. Se algo legítimo quebrar,
    # o recurso aparece lá com a diretiva que o bloqueou.
    #
    # Hosts declarados e por quê:
    #   challenges.cloudflare.com → widget Turnstile no login
    #   accounts.google.com       → OAuth do Google
    #   www.gstatic.com           → SDK do Firebase (push)
    #   cdnjs.cloudflare.com      → pdf.js (WCICompanionEntry)
    #   fonts.googleapis/gstatic  → @import de fonte nos relatórios da diretoria
    #   erbon / omnibees / viacep / open-meteo / cnpja / mercadolibre → APIs de
    #     integração chamadas do cliente
    # ─────────────────────────────────────────────────────────────────────────
    # Nota: o `\` no fim de cada linha é continuação de linha do TOML — o valor
    # final é uma única linha, sem quebras nem indentação.
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://accounts.google.com https://apis.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' data: https://fonts.gstatic.com; \
img-src 'self' data: blob: https:; \
media-src 'self' data: blob: https:; \
worker-src 'self' blob: https://cdnjs.cloudflare.com; \
connect-src 'self' blob: https://bnmyflgyrlskhljrbyfc.supabase.co wss://bnmyflgyrlskhljrbyfc.supabase.co https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://challenges.cloudflare.com https://cdnjs.cloudflare.com https://api.erbonsoftware.com https://pms.omnibees.com https://media.omnibees.com https://viacep.com.br https://api.open-meteo.com https://api.cnpja.com https://api.mercadolibre.com; \
frame-src 'self' https://challenges.cloudflare.com https://accounts.google.com; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'; \
report-to csp-endpoint; \
report-uri /.netlify/functions/csp-report"""

# Manifesto de atualização: nunca cachear (sempre versão mais recente)
[[headers]]
  for = "/update-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

# APK: Content-Type correto (Android reconhece como instalável)
# + cache curto (10 min) para distribuir versões novas rapidamente
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=600, must-revalidate"