
# Login por senha com lockout (3 tentativas + 30s). Sem verify_jwt: é o próprio
# login, o usuário ainda não tem token quando chama.
[functions.auth-login]
enabled = true
verify_jwt = false
entrypoint = "./functions/auth-login/index.ts"

[functions.learn-knowledge]
enabled = true
verify_jwt = true
import_map = "./functions/learn-knowledge/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/learn-knowledge/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/learn-knowledge/*.html" ]
